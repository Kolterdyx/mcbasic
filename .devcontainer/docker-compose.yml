
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: agent_only_password
    networks:
      - agent-net

  valkey:
    image: valkey/valkey:latest
    environment:
      - VALKEY_API_KEY=your_valkey_api_key_here
    networks:
      - agent-net

  # localstack:
  #   image: localstack/localstack:latest
  #   environment:
  #     - SERVICES=s3,sqs,lambda
  #     - DEFAULT_REGION=eu-south-2
  #   ports:
  #     - "4566:4566" # LocalStack edge port
  #   networks:
  #     - agent-net

volumes:
  go_cache:

networks:
  agent-net:
    driver: bridge
    internal: true # KEEP AS TRUE TO STOP INTERNET ACCESS
