services:
  monkey:
    build:
      context: ..
      dockerfile: ../Dockerfile
      args:
        USER_UID: 1001
        USER_GID: 1001
    container_name: agent_sandbox
    # command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      # We mount the Satellite Repo worktree here.
      - ../../:/workspace:z
      # Separate volume for Go cache to keep the agent's junk off your host
      - go_cache:/home/agent/go/pkg
    environment:
      - GO111MODULE=on
      - DB_HOST=db
    # Security: Drop all capabilities, then add only what's needed for Go
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - agent-net

  db:
    extends:
      file: ../docker-compose.yml
      service: db

  valkey:
    extends:
      file: ../docker-compose.yml
      service: valkey

